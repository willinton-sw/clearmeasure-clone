name: Build
run-name: "1.4.${{ github.run_number }} • Build • ${{ github.event.pull_request.title != '' && github.event.pull_request.title || github.head_ref || github.ref_name }}"
on:
  push:
  workflow_dispatch:
env:
  MAJOR_VERSION: 1
  MINOR_VERSION: 4

jobs:
  build-linux:
    name: Integration Build (SQL container)
    runs-on: ubuntu-latest
    concurrency:
      # Integration Build will be cancelled when new commits arrive on the branch. 
      # To protect the master branch, use ${{ github.ref != 'refs/heads/main' }} for cancel-in-progress:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
      pull-requests: write
    env:
      BUILD_CONFIGURATION: Release
      DOTNET_ROLL_FORWARD: LatestMajor

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v6.0.1

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Set version environment variable
      - name: Set Version
        run: |
          version="${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ github.run_number }}"
          echo "BUILD_BUILDNUMBER=$version" >> $GITHUB_ENV
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "Build version: $version"
          echo "github.ref=${{ github.ref }}"

      - name: Run CI Build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUILD_BUILDNUMBER: ${{ env.VERSION }}
          AI_OpenAI_ApiKey: ${{ secrets.AI_OPENAI_APIKEY }}
          AI_OpenAI_Url: ${{ vars.AI_OPENAI_URL }}
          AI_OpenAI_Model: ${{ vars.AI_OPENAI_MODEL }}
        run: |
          Write-Host "Running CI Build"
          . ./build.ps1
          Build

      # Publish test results
      - name: Test Reporter
        uses: dorny/test-reporter@v2.1.1
        if: always()
        with:
          name: Linux CI Test Results
          path: 'build/test/**/*.trx'
          reporter: dotnet-trx

      # Publish code coverage
      - name: Publish Code Coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: '**/build/test/**/In/**/coverage.cobertura.xml'
          flags: unittests-linux
          name: codecov-linux

      # Upload test results as artifacts
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: build/test/**/*.trx
          retention-days: 2

      # Upload code coverage as artifacts
      - name: Upload Code Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-linux
          path: '**/build/test/**/In/**/coverage.cobertura.xml'
          retention-days: 2

      - name: Mark PR as ready for review
        if: success()
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          # Find PR associated with this branch
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Looking for PR from branch: $BRANCH_NAME"

          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$PR_NUMBER" ]; then
            echo "Found PR #$PR_NUMBER, marking as ready for review..."
            gh pr ready "$PR_NUMBER" || echo "PR may already be ready or unable to mark ready"
          else
            echo "No open PR found for branch $BRANCH_NAME"
          fi

  build-sqlite:
    name: Integration Build (SQLite)
    runs-on: ubuntu-latest
    concurrency:
      group: build-sqlite-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
    env:
      BUILD_CONFIGURATION: Release
      DATABASE_ENGINE: SQLite

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Set Version
        run: |
          version="${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ github.run_number }}"
          echo "BUILD_BUILDNUMBER=$version" >> $GITHUB_ENV

      - name: Run Private Build (SQLite)
        shell: pwsh
        env:
          BUILD_BUILDNUMBER: ${{ env.BUILD_BUILDNUMBER }}
          AI_OpenAI_ApiKey: ${{ secrets.AI_OPENAI_APIKEY }}
          AI_OpenAI_Url: ${{ vars.AI_OPENAI_URL }}
          AI_OpenAI_Model: ${{ vars.AI_OPENAI_MODEL }}
          ConnectionStrings__SqlConnectionString: "Data Source=ChurchBulletin.db"
        run: |
          Write-Host "Running Private Build with SQLite"
          . ./build.ps1
          Build -UseSqlite
 
      - name: Test Reporter
        uses: dorny/test-reporter@v2.1.1
        if: always()
        with:
          name: SQLite Test Results
          path: 'build/test/**/*.trx'
          reporter: dotnet-trx

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-sqlite
          path: build/test/**/*.trx
          retention-days: 2

  integration-build-arm:
    name: Integration Build (ARM SQLite)
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: build-arm-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
    env:
      BUILD_CONFIGURATION: Release
      DATABASE_ENGINE: SQLite

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-arm-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-arm-

      - name: Set Version
        run: |
          version="${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ github.run_number }}"
          echo "BUILD_BUILDNUMBER=$version" >> $GITHUB_ENV

      - name: Run Private Build (ARM SQLite)
        shell: pwsh
        env:
          BUILD_BUILDNUMBER: ${{ env.BUILD_BUILDNUMBER }}
          AI_OpenAI_ApiKey: ${{ secrets.AI_OPENAI_APIKEY }}
          AI_OpenAI_Url: ${{ vars.AI_OPENAI_URL }}
          AI_OpenAI_Model: ${{ vars.AI_OPENAI_MODEL }}
          ConnectionStrings__SqlConnectionString: "Data Source=ChurchBulletin.db"
        run: |
          Write-Host "Running Private Build with SQLite on ARM"
          . ./build.ps1
          Build -UseSqlite

      - name: Test Reporter
        uses: dorny/test-reporter@v2.1.1
        if: always()
        with:
          name: ARM SQLite Test Results
          path: 'build/test/**/*.trx'
          reporter: dotnet-trx

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-arm-sqlite
          path: build/test/**/*.trx
          retention-days: 2

  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    concurrency:
      group: code-analysis-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore solution
        run: dotnet restore src/ChurchBulletin.sln

      - name: Check code style
        run: dotnet format style src/ChurchBulletin.sln --verify-no-changes --verbosity normal

      - name: Check analyzers
        run: dotnet format analyzers src/ChurchBulletin.sln --verify-no-changes --verbosity normal

      - name: Build with code analysis
        run: |
          dotnet build src/ChurchBulletin.sln --configuration Release --no-restore \
            /p:TreatWarningsAsErrors=true \
            /p:MSBuildTreatAllWarningsAsErrors=true \
            /p:EnforceCodeStyleInBuild=true

  build-windows:
    name: Integration Build (Windows LocalDB)
    runs-on: windows-latest
    concurrency:
      group: build-windows-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
    env:
      BUILD_CONFIGURATION: Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Set Version
        shell: pwsh
        run: |
          $version = "${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ github.run_number }}"
          "BUILD_BUILDNUMBER=$version" >> $env:GITHUB_ENV

      - name: Run Private Build (Windows LocalDB)
        shell: pwsh
        env:
          BUILD_BUILDNUMBER: ${{ env.BUILD_BUILDNUMBER }}
          AI_OpenAI_ApiKey: ${{ secrets.AI_OPENAI_APIKEY }}
          AI_OpenAI_Url: ${{ vars.AI_OPENAI_URL }}
          AI_OpenAI_Model: ${{ vars.AI_OPENAI_MODEL }}
        run: |
          Write-Host "Running Private Build with Windows LocalDB"
          . ./build.ps1
          Build

      - name: Test Reporter
        uses: dorny/test-reporter@v2.1.1
        if: always()
        with:
          name: Windows LocalDB Test Results
          path: 'build/test/**/*.trx'
          reporter: dotnet-trx

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: build/test/**/*.trx
          retention-days: 2

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    concurrency:
      group: security-scan-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore solution
        run: dotnet restore src/ChurchBulletin.sln

      - name: Check NuGet packages for known vulnerabilities
        run: |
          echo "Scanning NuGet packages for known vulnerabilities..."
          dotnet list src/ChurchBulletin.sln package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
          if grep -q "has the following vulnerable packages" vulnerability-report.txt; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi
          echo "No known vulnerabilities found."

      - name: Check for deprecated NuGet packages
        run: |
          echo "Scanning for deprecated NuGet packages..."
          dotnet list src/ChurchBulletin.sln package --deprecated 2>&1 | tee deprecated-report.txt
          if grep -q "has the following deprecated packages" deprecated-report.txt; then
            echo "::warning::Deprecated NuGet packages detected. Review deprecated-report.txt for details."
          else
            echo "No deprecated packages found."
          fi

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Scan for credential files in repository
        run: |
          echo "Scanning for potential credential and secret files..."
          FOUND=0
          # Check for files that commonly contain secrets
          for pattern in "*.pfx" "*.p12" "*.key" "*.pem" "*.env" "*.env.*" "credentials.json" "service-account*.json"; do
            MATCHES=$(find . -name "$pattern" -not -path "./.git/*" -not -path "*/bin/*" -not -path "*/obj/*" 2>/dev/null)
            if [ -n "$MATCHES" ]; then
              echo "::warning::Potential secret file(s) matching '$pattern':"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No credential files detected."
          fi

      - name: Check for security-sensitive patterns in code
        run: |
          echo "Scanning source code for security-sensitive patterns..."
          ISSUES=0
          # Hardcoded connection strings (not in config files)
          if grep -rn "Password=" src/ --include="*.cs" | grep -v "// " | grep -v "test" | grep -vi "stub" | grep -v "obj/" | grep -v "bin/"; then
            echo "::warning::Potential hardcoded connection string with password found in source code."
            ISSUES=$((ISSUES + 1))
          fi
          # Hardcoded API keys or tokens
          if grep -rn "api[_-]\?key\s*=\s*\"[A-Za-z0-9]" src/ --include="*.cs" -i | grep -v "// " | grep -v "Configuration" | grep -v "appsettings" | grep -v "obj/" | grep -v "bin/"; then
            echo "::warning::Potential hardcoded API key found in source code."
            ISSUES=$((ISSUES + 1))
          fi
          if [ "$ISSUES" -eq 0 ]; then
            echo "No security-sensitive patterns detected."
          fi

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            vulnerability-report.txt
            deprecated-report.txt
          retention-days: 2

  acceptance-tests:
    name: Acceptance Tests
    if: success()
    runs-on: ubuntu-latest
    concurrency:
      group: acceptance-tests-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
    env:
      BUILD_CONFIGURATION: Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/AcceptanceTests/AcceptanceTests.csproj') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Set Version
        run: |
          version="${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ github.run_number }}"
          echo "BUILD_BUILDNUMBER=$version" >> $GITHUB_ENV

      - name: Run Acceptance Tests
        shell: pwsh
        env:
          BUILD_BUILDNUMBER: ${{ env.BUILD_BUILDNUMBER }}
          AI_OpenAI_ApiKey: ${{ secrets.AI_OPENAI_APIKEY }}
          AI_OpenAI_Url: ${{ vars.AI_OPENAI_URL }}
          AI_OpenAI_Model: ${{ vars.AI_OPENAI_MODEL }}
        run: |
          Write-Host "Running Acceptance Tests"
          . ./build.ps1
          Invoke-AcceptanceTests

      - name: Test Reporter
        uses: dorny/test-reporter@v2.1.1
        if: always()
        with:
          name: Acceptance Test Results
          path: 'build/test/**/*.trx'
          reporter: dotnet-trx

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-acceptance
          path: build/test/**/*.trx
          retention-days: 2

  acceptance-tests-arm:
    name: Acceptance Tests (ARM SQLite)
    if: success()
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: acceptance-tests-arm-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
    env:
      BUILD_CONFIGURATION: Release
      DATABASE_ENGINE: SQLite

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-arm-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-arm-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/AcceptanceTests/AcceptanceTests.csproj') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Set Version
        run: |
          version="${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ github.run_number }}"
          echo "BUILD_BUILDNUMBER=$version" >> $GITHUB_ENV

      - name: Run Acceptance Tests (ARM SQLite)
        shell: pwsh
        env:
          BUILD_BUILDNUMBER: ${{ env.BUILD_BUILDNUMBER }}
          AI_OpenAI_ApiKey: ${{ secrets.AI_OPENAI_APIKEY }}
          AI_OpenAI_Url: ${{ vars.AI_OPENAI_URL }}
          AI_OpenAI_Model: ${{ vars.AI_OPENAI_MODEL }}
          ConnectionStrings__SqlConnectionString: "Data Source=ChurchBulletin.db"
        run: |
          Write-Host "Running Acceptance Tests with SQLite on ARM"
          . ./build.ps1
          Invoke-AcceptanceTests -UseSqlite

      - name: Test Reporter
        uses: dorny/test-reporter@v2.1.1
        if: always()
        with:
          name: ARM Acceptance Test Results
          path: 'build/test/**/*.trx'
          reporter: dotnet-trx

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-acceptance-arm
          path: build/test/**/*.trx
          retention-days: 2

